[project]
name = "ai-customer-support"
version = "0.1.0"
description = "AI email support agent: poll a mailbox, classify, draft with tools, let Python decide"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[openai]>=2.64.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "nest-asyncio>=1.6.0",
    "pydantic-evals>=2.64.0",
]
